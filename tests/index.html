<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>VNSim – Tests</title>
<style>
  body { font: 14px/1.4 monospace; margin: 16px; background: #fff; color: #3E444C; }
  .pass { color: #00915A; } .fail { color: #CC2D3C; font-weight: bold; }
</style>
</head>
<body>
<pre id="log"></pre>
<script src="../js/i18n.js"></script>
<script src="../js/isa.js"></script>
<script src="../js/assembler.js"></script>
<script src="../js/machine.js"></script>
<script src="../js/format.js"></script>
<script src="../js/examples.js"></script>
<script>
  // Minimaler Test-Runner; Ergebnis steht im DOM (headless: chromium --dump-dom)
  const TESTS = [];
  function test(name, fn) { TESTS.push({ name, fn }); }
  function eq(actual, expected, msg) {
    const a = JSON.stringify(actual), e = JSON.stringify(expected);
    if (a !== e) throw new Error(`${msg || 'Wert'}: erwartet ${e}, erhalten ${a}`);
  }
  function ok(cond, msg) { if (!cond) throw new Error(msg || 'Bedingung nicht erfüllt'); }
  VN.i18n.setLang('de');   // Tests prüfen deutsche Meldungen, sofern nicht anders gesetzt
</script>
<script src="tests.js"></script>
<script>
  const log = document.getElementById('log');
  let failed = 0;
  for (const t of TESTS) {
    const line = document.createElement('div');
    try { t.fn(); line.className = 'pass'; line.textContent = 'PASS ' + t.name; }
    catch (e) { failed++; line.className = 'fail'; line.textContent = 'FAIL ' + t.name + ' – ' + e.message; }
    log.appendChild(line);
  }
  const summary = document.createElement('div');
  summary.id = 'summary';
  summary.textContent = `${TESTS.length - failed}/${TESTS.length} Tests bestanden` + (failed ? ` – ${failed} FEHLGESCHLAGEN` : '');
  summary.className = failed ? 'fail' : 'pass';
  log.appendChild(summary);
</script>
</body>
</html>
